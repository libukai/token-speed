[package]
name = "token-speed"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
readme = "README.md"
repository = "https://github.com/libukai/token-speed"
homepage = "https://github.com/libukai/token-speed"
keywords = ["codex", "claude", "tui", "tokens", "cli"]
categories = ["command-line-utilities", "development-tools"]
description = "A terminal observatory for Codex, Claude Code, DSH and Magpie token throughput"
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "token-speed"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
csv = "1"
ruzstd = "0.9.1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
